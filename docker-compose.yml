
services:
  db:
    image: postgres:16-alpine
    container_name: finstack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?finstack_db}
      POSTGRES_USER: ${DB_USER:?finstack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?222444}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - finstack-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: finstack-api:1.0
    container_name: finstack-api

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?finstack_db}
      DB_USER: ${DB_USER:?finstack_user}
      DB_PASSWORD: ${DB_PASSWORD:?222444}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?e5b600af67299e8182c30fecba77f48871245a771626315cca45e198e3aa7185}

    ports:
      - "8001:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - finstack-network

volumes:
  postgres_data:

networks:
  finstack-network:
    driver: bridge

