
services:
  db:
    image: postgres:16-alpine
    container_name: finstack-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - finstack-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: finstack-api:1.0
    container_name: finstack-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - finstack-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: finstack-api:1.0
    container_name: finstack-api
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USER: ${DB_USER:?DB_USER must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}

    ports:
      - "8001:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - finstack-network

volumes:
  postgres_data:

networks:
  finstack-network:
    driver: bridge
